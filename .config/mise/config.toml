[settings]
legacy_version_file = false

[tools]
bun = "1.3.13"
java = "temurin-17"
node = "24.11"
"pipx:platformio" = "6.1.19"

[env]
_.file = ".env"

[tasks.install]
run = "bun install"
dir = "{{cwd}}/src"

[tasks."run:mobile"]
run ="bun run android"
dir = "{{cwd}}/src"

[tasks."test:water"]
description = "Water module native tests (GoogleTest)"
dir = "water-module"
run = "pio test -e local"

[tasks."test:heater"]
description = "Heater module native tests (GoogleTest)"
dir = "heater-module"
run = "pio test -e local"

[tasks."build:water"]
description = "Water module ESP32 firmware build"
dir = "water-module"
run = "pio run -e esp32doit-devkit-v1"

[tasks."build:heater"]
description = "Heater module ESP32 firmware build"
dir = "heater-module"
run = "pio run -e esp32doit-devkit-v1"
