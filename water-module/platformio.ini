; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; PlatformIO has no lock file, so every platform and library below is pinned to
; an exact version. Ranges let a fresh CI runner resolve a release the code has
; never been built against, which is how Adafruit BME280 2.3.0 once broke the
; heater firmware. Bump these deliberately, never implicitly.
[platformio]
default_envs = local

[env]
lib_extra_dirs = ../shared-libs

[env:esp32doit-devkit-v1]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
debug_tool = esp-prog
debug_init_break = tbreak setup
test_ignore = *
build_src_filter = +<*> -<main_local.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

[env:local]
platform = native@1.2.1
test_framework = googletest
; googletest is pulled in by test_framework, and listing it here pins it too.
lib_deps =
    fabiobatsilva/ArduinoFake@0.4.0
    google/googletest@1.17.0
build_src_filter = +<*> -<main_embedded.cpp> -<lib/esp32>
